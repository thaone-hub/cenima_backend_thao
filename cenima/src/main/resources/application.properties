
spring.application.name=cenima

# SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CINEMA_THAO_ETICKET_DEMO;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=never
ticket.zone=${TICKET_ZONE:Asia/Ho_Chi_Minh}
ticket.qr-max-version=${TICKET_QR_MAX_VERSION:25}
ticket.max-input-bytes=${TICKET_MAX_INPUT_BYTES:32768}
ticket.demo-key-directory=${TICKET_DEMO_KEY_DIRECTORY:.local/keys/demo}
traditional.key-directory=${TRADITIONAL_KEY_DIRECTORY:.local/keys/integrated}
